<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simulatore di Fisiologia</title>
  <meta name="description" content="Simulatori interattivi e scientificamente validati per il corso di Fisiologia Generale: dalla membrana al potenziale d'azione, dalle sinapsi al rene.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232459a8'/%3E%3Cpath d='M3 18h6l3-9 4 15 3-11 2 5h8' fill='none' stroke='white' stroke-width='2.4' stroke-linejoin='round' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="vendor/katex/katex.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <button class="icon-btn menu-btn" id="menuBtn" aria-label="Apri il menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <a class="brand" href="#inizio">Simulatore di Fisiologia <small>Fisiologia Generale</small></a>
    <span class="spacer"></span>
    <button class="icon-btn" id="themeBtn" aria-label="Cambia tema chiaro/scuro" title="Tema chiaro/scuro">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </header>
  <div class="scrim" id="scrim"></div>
  <div class="layout">
    <nav class="sidebar" id="sidebar" aria-label="Indice">
      <input type="search" id="searchBox" class="search" placeholder="Cerca (es. Km, soglia, osmosi)…" aria-label="Cerca nelle lezioni e nei simulatori" autocomplete="off">
      <div class="side-tabs" role="tablist">
        <button role="tab" id="tabL" aria-selected="true">Per lezione</button>
        <button role="tab" id="tabA" aria-selected="false">Per argomento</button>
      </div>
      <div id="sideList"></div>
    </nav>
    <main id="main"><div class="content" id="content"></div></main>
  </div>

  <!-- librerie (locali: funziona anche senza internet) -->
  <script src="vendor/three.min.js"></script>
  <script src="vendor/OrbitControls.js"></script>
  <script src="vendor/katex/katex.min.js"></script>
  <!-- motore numerico -->
  <script src="js/core/base.js"></script>
  <script src="js/core/electro.js"></script>
  <script src="js/core/hh.js"></script>
  <script src="js/core/cable.js"></script>
  <script src="js/core/stoch.js"></script>
  <script src="js/core/transport.js"></script>
  <script src="js/core/systems.js"></script>
  <!-- interfaccia -->
  <script src="js/ui/ui.js"></script>
  <script src="js/ui/plot.js"></script>
  <script src="js/ui/explain.js"></script>
  <script src="js/ui/three.js"></script>
  <!-- simulatori -->
  <script src="js/sims/registry.js"></script>
  <script src="js/sims/s1_omeostasi.js"></script>

  <script src="js/sims/s8_sensoriale.js"></script>
  <script src="js/sims/s9_rene.js"></script>
  <!-- prove d'esame -->
  <script src="js/quiz/engine.js"></script>
  <script src="js/quiz/gen.js"></script>
  <script src="js/quiz/bank-01-09.js"></script>
  <script src="js/quiz/bank-10-14.js"></script>
  <script src="js/quiz/bank-15-23.js"></script>
